version: '3.8'

services:
  # --- DATABASE ---
  db-novel:
    image: postgres:15-alpine
    container_name: postgres_container
    environment:
      POSTGRES_USER: ${DB_ROOT_USER}      # Lấy từ .env
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD} # Lấy từ .env
      POSTGRES_DB: ${DB_NAME}             # Lấy từ .env
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  # --- BACKEND SPRING BOOT ---
  app-backend:
    build: ./backend
    container_name: spring_boot_app
    ports:
      - "8080:8080"
    environment:
      # Spring Boot cần kết nối vào DB, nên ta cũng truyền biến từ .env vào đây
      # Lưu ý: host vẫn là tên service 'db-novel' hoặc container_name 'postgres_container'
      DB_URL: jdbc:postgresql://postgres_container:5432/${DB_NAME}
      DB_USERNAME: ${DB_ROOT_USER}
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      - db-novel