name: Build and Push Docker Image

# Sự kiện kích hoạt: Khi có code push vào nhánh main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Mượn một máy ảo Ubuntu của GitHub

    steps:
    # Bước 1: Tải code từ kho về máy ảo
    - name: Checkout code
      uses: actions/checkout@v4

    # Bước 2: Đăng nhập vào Docker Hub (Dùng 2 chìa khóa trong két sắt)
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Bước 3: Cài đặt Docker Buildx (Công cụ build xịn hơn mặc định)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Bước 4: Build và đẩy lên Docker Hub
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        # Đánh 2 nhãn cùng lúc:
        # 1. latest: Để AWS luôn lấy bản mới nhất
        # 2. v0.0.x: Để lưu lịch sử, quay lại khi cần
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/app-truyen-backend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/app-truyen-backend:v0.0.${{ github.run_number }}
          