version: '3.8'
services:
  app-backend:
    image: ${DOCKERHUB_USERNAME}/app-truyen-backend:latest
    expose:
      - "8080"
    environment:
      - DB_URL=jdbc:postgresql://db-novel:5432/noveldb
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - db-novel
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-southeast-1
        awslogs-group: /ecs/app-backend
        awslogs-create-group: "true"
    networks:
      - app-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-backend
    logging: # (Xem ai gọi API)
      driver: awslogs
      options:
        awslogs-region: ap-southeast-1
        awslogs-group: /ecs/nginx-proxy
        awslogs-create-group: "true"
    networks:
      - app-network

  db-novel:
    image: postgres:15-alpine
    command: postgres -c 'log_min_duration_statement=1000' # <--- (Bắt query chậm > 1s)
    environment:
      - POSTGRES_DB=noveldb
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    logging: # <---  (Xem log SQL)
      driver: awslogs
      options:
        awslogs-region: ap-southeast-1
        awslogs-group: /ecs/db-novel
        awslogs-create-group: "true"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data_prod: